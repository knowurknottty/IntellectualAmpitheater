[project]
name = "intelamp-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "greenlet>=3.1,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "aiosqlite>=0.21,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelamp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
